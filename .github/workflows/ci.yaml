name: CI

on:
  workflow_call:
  merge_group:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: lint source
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: install dependencies
        run: composer install --ignore-platform-req=php --prefer-dist --no-progress

      - name: lint source
        run: composer run lint -- --no-progress-bar

  analyze:
    name: analyze source
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: install dependencies
        run: composer install --ignore-platform-req=php --prefer-dist --no-progress

      - name: analyze source
        run: composer run analyze -- --no-progress

  test:
    name: test source for PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            symfony: '^7.4'
          - php: '8.4'
            symfony: '^8.0'
          - php: '8.5'
            symfony: '^8.0'
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: install dependencies
        run: |
          composer require --dev --no-update "symfony/http-client:${{ matrix.symfony }}" "symfony/webhook:${{ matrix.symfony }}"
          composer require --no-update "symfony/mailer:${{ matrix.symfony }}"
          composer update --prefer-dist --no-progress

      - name: test source
        run: composer run test -- --no-progress
