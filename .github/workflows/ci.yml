name: CI

on:
  workflow_call:
  merge_group:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: lint source
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: install php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: install dependencies
        run: composer install --ignore-platform-req=php --prefer-dist --no-progress

      - name: lint source
        run: composer run lint -- --no-progress-bar

  analyze:
    name: analyze source
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: install php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: install dependencies
        run: composer install --ignore-platform-req=php --prefer-dist --no-progress

      - name: analyze source
        run: composer run analyze -- --no-progress

  test:
    name: test source for ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: install php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: install dependencies
        run: composer install --ignore-platform-req=php --prefer-dist --no-progress

      - name: test source
        run: composer run test -- --no-progress
